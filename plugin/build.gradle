plugins {
    id 'com.cleanroommc.versioning'
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'com.gradle.plugin-publish' version '2.1.1'
    id 'signing'
}

group = providers.gradleProperty('group').get()
base.archivesName = 'versioning-gradle'

// The plugin ships the core library inside its own jar, so compile it here rather than depending on the root project.
sourceSets.main.java.srcDir(layout.settingsDirectory.dir('src/main/java'))

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation gradleTestKit()
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

gradlePlugin {
    website = 'https://github.com/CleanroomMC/Versioning'
    vcsUrl = 'https://github.com/CleanroomMC/Versioning.git'
    plugins {
        versioning {
            id = 'com.cleanroommc.versioning'
            implementationClass = 'com.cleanroommc.versioning.gradle.CleanroomVersioningPlugin'
            displayName = 'Cleanroom Versioning'
            description = 'Sets project.version from Git tags, branch policy, and the build environment.'
            tags.set(['version', 'semver', 'git', 'versioning'])
            compatibility {
                features {
                    configurationCache = true
                }
            }
        }
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

publishing {
    publications {
        pluginMaven(MavenPublication) {
            artifactId = 'versioning-gradle'
        }
    }
    repositories {
        maven {
            name = 'CleanroomMaven'
            url = 'https://maven.cleanroommc.com'
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

def signingKey = providers.gradleProperty('signingKey')
def signingPassword = providers.gradleProperty('signingPassword')

signing {
    required = {
        gradle.taskGraph.allTasks.any { it.name == 'publishPlugins' }
    }
    if (signingKey.present && signingPassword.present) {
        useInMemoryPgpKeys(signingKey.get(), signingPassword.get())
    }
}
