name: Build

on:
  push:
    branches:
      - master
      - 'develop/**'
  pull_request:
    branches:
      - master
      - 'develop/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A merge into the release branch sits between the merge and the release tag, so it computes the next patch of the
  # previous tag, a number that will never ship. Development branches pin their number, so their merges are left alone
  # and still publish.
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: check
        run: |
          parents=$(git rev-list --parents -n 1 HEAD | wc -w)
          if [ "$parents" -gt 2 ] && [ "$GITHUB_REF" = 'refs/heads/master' ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Test
        run: ./gradlew test

      - name: Print version
        id: version
        run: |
          version=$(./gradlew -q --console=plain :printVersion)
          echo "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # A branch created at a release tag computes the bare release coordinate, and publishing that from a
      # development push would overwrite the release. Only a pre-release version belongs here.
      - name: Publish development build
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/develop/') && contains(steps.version.outputs.value, '-') }}
        env:
          ORG_GRADLE_PROJECT_CleanroomMavenUsername: ${{ secrets.MAVEN_NAME }}
          ORG_GRADLE_PROJECT_CleanroomMavenPassword: ${{ secrets.MAVEN_PASSWORD }}
        run: ./gradlew publish --no-configuration-cache
